<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务清单</title><style>body{font:16px system-ui;max-width:720px;margin:40px auto;padding:16px;color:#172033}button,input,select{font:inherit;margin:6px;padding:8px}li{margin:8px 0}[data-status="done"]{text-decoration:line-through}button{cursor:pointer}</style></head><body><h1>任务清单</h1><form data-testid="task-form"><label>任务<input data-testid="task-input" required></label><button data-testid="add-task">新增任务</button></form><ul data-testid="task-list"></ul><script>const tasks=[];const input=document.querySelector("[data-testid=task-input]");const list=document.querySelector("[data-testid=task-list]");function render(){list.replaceChildren();tasks.forEach((t,i)=>{const li=document.createElement("li");li.dataset.testid="task-row";li.dataset.status=t.done?"done":"open";const box=document.createElement("input");box.type="checkbox";box.dataset.testid="task-complete";box.checked=t.done;box.onchange=()=>{t.done=box.checked;render()};const name=document.createElement("span");name.dataset.testid="task-name";name.textContent=t.name;li.append(box,name);list.append(li)})}document.querySelector("[data-testid=task-form]").onsubmit=e=>{e.preventDefault();if(!input.value.trim())return;tasks.push({name:input.value.trim(),done:false});input.value="";render()};render();</script></body></html>
