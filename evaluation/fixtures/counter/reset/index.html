<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>计数器</title><style>body{font:16px system-ui;max-width:720px;margin:40px auto;padding:16px;color:#172033}button,input,select{font:inherit;margin:6px;padding:8px}li{margin:8px 0}[data-status="done"]{text-decoration:line-through}button{cursor:pointer}</style></head><body><h1>计数器</h1><output data-testid="count">0</output><button data-testid="increment">增加</button><button data-testid="reset">重置</button><script>let count=0;const output=document.querySelector("[data-testid=count]");document.querySelector("[data-testid=increment]").onclick=()=>output.textContent=String(++count);document.querySelector("[data-testid=reset]").onclick=()=>{count=0;output.textContent="0"};</script></body></html>
